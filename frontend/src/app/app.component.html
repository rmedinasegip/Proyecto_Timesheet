<header class="app-header">
  <div class="app-header__row">
    <a routerLink="/" class="app-header__brand">
      <span class="eyebrow app-header__eyebrow">Gestión y control de proyectos</span>
      <span class="app-header__title">TimeSheets</span>
    </a>

    <nav class="app-nav" *ngIf="currentUser">
      <a *ngIf="currentUser.role !== 'CON'" routerLink="/projects" routerLinkActive="active">Proyectos</a>
      <a routerLink="/timesheets" routerLinkActive="active">Cronograma</a>
      <a routerLink="/progress" routerLinkActive="active">Avance Proyecto</a>
      <a routerLink="/weekly-progress" routerLinkActive="active">Avance Proyecto Semanal</a>
    </nav>

    <div class="app-header__account">
      <span *ngIf="currentUser" class="app-header__user">{{ currentUser.name }} <span class="app-header__role">{{ currentUser.roleName }}</span></span>
      <button *ngIf="currentUser" pButton type="button" label="Cerrar sesión" class="p-button-text p-button-sm" (click)="logout()"></button>
      <span class="app-header__status" [class.app-header__status--down]="backendStatus !== 'ok'">
        <span class="app-header__status-dot" aria-hidden="true"></span>{{ backendStatus }}
      </span>
    </div>
  </div>
</header>
<router-outlet></router-outlet>
