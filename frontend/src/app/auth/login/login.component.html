<div class="login-page">
  <div class="login-panel">
    <span class="eyebrow">Acceso al sistema</span>
    <h1 class="login-panel__title">TimeSheets</h1>
    <div class="ruler-divider"></div>
    <p class="login-panel__tagline">Gestión y control de proyectos — LLACSAA</p>

    <form class="login-form" (ngSubmit)="submit()">
      <div class="field">
        <label class="field-label">Correo</label>
        <input type="email" name="email" [(ngModel)]="email" autocomplete="username" class="p-inputtext" />
      </div>
      <div class="field">
        <label class="field-label">Contraseña</label>
        <input type="password" name="password" [(ngModel)]="password" autocomplete="current-password" class="p-inputtext" />
      </div>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button pButton type="submit" label="Ingresar" [loading]="loading" class="submit-btn"></button>
    </form>
  </div>
</div>
